<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cimora · 构图方案对比</title><style>body{margin:0;background:#d8d8d8;font-family:Arial,"Microsoft YaHei",sans-serif;color:#171717}header{padding:32px 4% 20px}h1{font-size:26px;margin:0 0 12px}p{line-height:1.7;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:0 4% 50px}article{min-width:0}h2{font-size:22px;margin-bottom:8px}img{width:100%;display:block;box-shadow:0 5px 20px #0002;margin-top:20px}.tag{background:#d7ff00;padding:4px 9px;font-size:12px} @media(max-width:720px){.grid{grid-template-columns:1fr}}</style><header><h1>CIMORA / GAME — 整页构图对比</h1><p>这是布局草图，不是最终 UI。灰块是素材位置，交叉线表示占位，不代表最终画风。先看黑白面积、阅读顺序和跨区关系。</p></header><div class="grid"><article><h2>A · 大斜面切割 <span class="tag">推荐</span></h2><p>一块黑色大面从右侧进入，在能力区展开为作品背景，再斜向退出。标题、作品和背景共用边界，留白更稳定。</p><img src="game-composition-a.svg" alt="方案 A：大斜面连续构图"></article><article><h2>B · 杂志海报拼接</h2><p>全幅首屏、错位能力面板和大小作品窗口组成编辑式排版。背景随内容改变轮廓，节奏更跳跃，对素材构图要求更高。</p><img src="game-composition-b.svg" alt="方案 B：杂志式错位构图"></article></div></html>
